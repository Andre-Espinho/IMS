# Builds the Windows installer when a version tag is pushed (for example v0.1.0)
# and attaches it to a GitHub release. Runs the same steps as scripts/build-release.ps1.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create backend virtualenv
        shell: pwsh
        run: |
          python -m venv backend\.venv
          backend\.venv\Scripts\python.exe -m pip install -r backend\requirements.txt

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ims-installer
          path: release/IMS Setup *.exe

      - name: Attach installer to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/IMS Setup *.exe
